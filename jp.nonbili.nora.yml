app-id: jp.nonbili.nora
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.chromium.*
modules:
  - name: nora
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/run/build/nora/bin
      env:
        VITE_BUILD_TARGET: portable
    build-commands:
      - bun run bundle
      - |
        cd desktop
        bun electron-vite build
        bun electron-builder --dir --publish never --config.electronDist=../node_modules/electron/dist2
        cp -a dist/linux*unpacked /app/main

      - install -Dm755 -t /app/bin/ ./run.sh
      - install -Dm644 metadata/flatpak/jp.nonbili.nora.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 metadata/flatpak/jp.nonbili.nora.desktop -t /app/share/applications/
      - install -Dm644 desktop/icon.png /app/share/icons/hicolor/512x512/apps/jp.nonbili.nora.png
    sources:
      - type: archive
        url: https://github.com/nonbili/Nora-Desktop/releases/download/v0.2.10/source.tar.gz
        sha256: cd0e4c07b125da9ce58db2ad411eca562b5310b18757c45928e5de146b5c70e5
        strip-components: 0

      - type: archive
        url: https://github.com/nonbili/Nora-Desktop/releases/download/v0.2.10/node_modules-x64.tar.gz
        sha256: c625491b9f08910175e3875de9ac2a473cadc39a38748685d974667ac8e91c3d
        dest: node_modules
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-x64.zip
        sha256: 400824c82bfcc0854365bcada11cf53d7384ecb1e2c3da0e2c0a2c6a527d5629
        dest: bin
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.2.0/electron-v43.2.0-linux-x64.zip
        sha256: f77ca6ed67bbc68702b69b56ad499bca6ae090705ade7d04f0ac545e409dec68
        strip-components: 0
        dest: node_modules/electron/dist2
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/nonbili/Nora-Desktop/releases/download/v0.2.10/node_modules-arm64.tar.gz
        sha256: aa4ac7b36189ccab44efdaa8fd6d4dc6606817101159546c908da0f0645dde55
        dest: node_modules
        only-arches: [aarch64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-aarch64.zip
        sha256: 65666a18439e891e5751b666103fe591a8519f11b66ec4bd8654c5515d4fff8a
        dest: bin
        only-arches: [aarch64]

      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.2.0/electron-v43.2.0-linux-arm64.zip
        sha256: 50e1cdefbf8590e0d89b0276314a99c7b98e8eed732204c6f1a1c2a38376ed87
        strip-components: 0
        dest: node_modules/electron/dist2
        only-arches: [aarch64]

      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/Nora "$@"
